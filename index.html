<style>
/* Layout: app de una pantalla — ficha de la vida arriba, diario año a año en el centro, mando de edad abajo */
:root{
  --bg:#e7ede8; --surface:#fbfcfa; --sunk:#f0f4f1; --line:#cbd6ce; --ink:#17221c; --muted:#56675d;
  --accent:#2b5a4a; --on-accent:#f2f7f4; --amber:#cf7a24; --on-amber:#1c1208;
  --good:#2a7a4b; --warn:#a8741a; --bad:#b03e2e; --scrim:rgba(10,18,14,.5);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#161f1a; --sunk:#111915; --line:#2a3730; --ink:#e2eae4; --muted:#93a59a;
  --accent:#80c0a8; --on-accent:#0d1813; --amber:#e49b55; --on-amber:#1c1208;
  --good:#6fc28f; --warn:#e2b452; --bad:#ee7d6b; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#161f1a; --sunk:#111915; --line:#2a3730; --ink:#e2eae4; --muted:#93a59a;
  --accent:#80c0a8; --on-accent:#0d1813; --amber:#e49b55; --on-amber:#1c1208;
  --good:#6fc28f; --warn:#e2b452; --bad:#ee7d6b; --scrim:rgba(0,0,0,.6); color-scheme:dark}

html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.01em}

.app{height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 10px}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.who{min-width:0}
.who h1{font-size:24px;line-height:1.1;overflow-wrap:anywhere}
.meta{margin:3px 0 0;color:var(--muted);font-size:13px}
.cash{margin:4px 0 0;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.cash .debt{color:var(--bad);margin-left:8px}
.top-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chip.free{border-color:var(--accent);color:var(--accent);font-weight:700}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.stat .lab{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.stat .lab b{font-family:var(--mono);font-weight:500;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}
.track{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:3px}
.fill{height:100%;border-radius:99px;transition:width .35s ease}
.lo{background:var(--bad)} .mid{background:var(--warn)} .hi{background:var(--good)}

.panel{flex:1;min-height:0;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px 14px}
.panel h3{font-family:var(--display);font-weight:800;font-size:17px;margin:16px 0 8px}
.panel h3 + .muted{margin-top:-4px}
.muted{color:var(--muted)}
.note{color:var(--muted);font-size:13px;margin:0 0 8px}
.year{display:grid;grid-template-columns:3rem 1fr;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.year:first-child{border-top:0}
.yr{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.yr b{display:block;font-family:var(--display);font-size:22px;line-height:1;color:var(--ink);font-weight:800;letter-spacing:0;text-transform:none}
.line{margin:0 0 4px}
.line:last-child{margin-bottom:0}
.line.good{color:var(--good)} .line.bad{color:var(--bad)}
.line.money{color:var(--muted);font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.line.quiet{color:var(--muted);font-style:italic}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.card{text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
button.card:not(:disabled):hover{border-color:var(--accent)}
.card b{font-size:15px}
.card small{color:var(--muted);font-size:12.5px}
.card .price{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .ico{font-size:24px;line-height:1;margin-bottom:4px}
.card.locked{opacity:.5}
.card.risk{border-style:dashed}

.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row > div{min-width:0}
.row small{display:block;color:var(--muted);font-size:12.5px}
.row.person{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;padding-inline:0}
.row.person .bondbar{width:84px;flex-shrink:0}
.row.dead{opacity:.55}
.lead{display:flex;align-items:center;gap:10px;min-width:0}
.em{font-size:22px;line-height:1;width:28px;text-align:center;flex-shrink:0}
.pill{display:inline-block;font-size:13px;padding:4px 10px;border-radius:99px;background:var(--sunk);border:1px solid var(--line)}
.banner{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.banner b{font-family:var(--display);font-size:18px}

.btn{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;font-weight:700;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-weight:400}
.btn.ghost:not(:disabled):hover{border-color:var(--accent)}
.btn.small{padding:6px 10px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.who{flex:1}
.avatar{width:58px;height:58px;flex-shrink:0}
.avatar svg{width:100%;height:100%;display:block}
.avatar.big{width:84px;height:84px;margin:0 auto 6px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.app.shake{animation:shake .4s}
@media (prefers-reduced-motion: reduce){.app.shake{animation:none}}
.cpbox{width:100%;background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;font-family:var(--mono);font-size:12px;resize:vertical}
.tut b{color:var(--accent)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.traits{margin:-4px 0 0;font-size:12.5px;color:var(--muted)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px;margin:0 auto}
.memc{aspect-ratio:1;font-size:28px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);max-width:100%}
.memc.ok{background:var(--surface);border-color:var(--good)}
.memc:disabled{opacity:1;cursor:default}
.maze{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;max-width:320px;margin:0 auto;font-size:20px;text-align:center;line-height:1.5}
.pad{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin-top:12px}
.tl p{margin:0 0 4px;font-size:13.5px}
.tl b{font-family:var(--mono);color:var(--muted);margin-right:6px;font-weight:500}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:4px;scrollbar-width:thin}
.chips .chip{flex-shrink:0}
.chips .chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}

.dock{display:flex;flex-direction:column;gap:8px}
.age-btn{width:100%;border:0;border-radius:14px;background:var(--amber);color:var(--on-amber);padding:11px 14px;display:flex;justify-content:center;align-items:baseline;gap:10px;font-family:var(--display);font-weight:800;font-size:24px;line-height:1}
.age-btn small{font-family:var(--body);font-weight:700;font-size:13px;opacity:.8}
.age-btn:active{transform:translateY(1px)}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.tabs button{background:none;border:0;border-radius:9px;padding:5px 1px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.tabs .ti{font-size:19px;line-height:1.1}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--accent);font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}

.overlay{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding:16px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:520px;max-height:88%;overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:20px;animation:up .22s ease-out}
@media (min-width:700px){.overlay{align-items:center}}
@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 128px);z-index:30;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center;animation:up .22s ease-out}
@media (prefers-reduced-motion: reduce){.sheet,.toast{animation:none}.fill{transition:none}}
.sheet h2{font-size:24px;margin-bottom:8px}
.sheet p{margin:0 0 12px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px !important;font-family:var(--mono)}
.choices{display:grid;gap:8px;margin-top:14px}
.res{font-size:17px}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form select{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--ink);font-size:15px}
.warn{color:var(--bad);font-size:13px}
.fm{display:grid;gap:2px;margin-bottom:10px;font-size:13px}
.fm span{display:flex;justify-content:space-between}
.fm output{font-family:var(--mono)}
.fm input{width:100%;accent-color:var(--accent)}
.sum{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 6px;font-size:14px}
.sum dt{color:var(--muted)} .sum dd{margin:0;font-variant-numeric:tabular-nums}
</style>

</div>

/* ---------- crear vidas ---------- */
function baseLife(o){const q=baseLife0(o);finishLife(q,o);return q}
function baseLife0(o){
  const sex=o.sex||pick(['M','F']);
  return {first:o.first||pick(sex==='M'?MN:FN),last:o.last||`${pick(SUR)} ${pick(SUR)}`,sex,c:o.c??R(0,COUNTRIES.length-1),undoc:false,
    pref:o.pref||(sex==='M'?'F':'M'),age:o.age||0,alive:true,
    s:{hap:R(60,95),hea:R(70,100),sma:R(20,90),loo:R(20,90)},money:o.money||0,debt:0,edu:0,school:null,uni:null,major:null,
    job:null,pension:0,rels:[],assets:[],pets:[],log:[],used:{},sick:null,karma:0,study:0,
    fame:0,foll:0,monet:false,jail:null,fugitive:false,record:0,athl:R(10,40),cnt:{},everJob:false,biz:[],inv:{},mob:null}}
function newLife(o={}){
  queue.length=0;
  p=baseLife(o);
  const [s1,s2]=p.last.split(' ');
  const dad=person('parent',{sex:'M',last:`${s1} ${pick(SUR)}`,age:R(21,42),bond:R(60,95)});
  const mom=person('parent',{sex:'F',last:`${s2} ${pick(SUR)}`,age:R(19,40),bond:R(65,98)});
  p.rels.push(mom,dad);
  for(let i=0,n=R(0,2);i<n;i++)p.rels.push(person('sibling',{age:R(1,9),last:p.last}));
  S={p,gen:1,cemetery:S?.cemetery||[],ach:S?.ach||{},ribbons:S?.ribbons||{},goalsDone:S?.goalsDone||0,lineage:[]};
  L(`👶 Naces en ${COUNTRIES[p.c].n} en ${p.born}. Eres ${g('un niño','una niña')} y te llaman ${p.first}.`,'good');
  L(`🧬 Tus rasgos: ${p.traits.map(k=>`${TR(k).e} ${TR(k).n}`).join(', ')}.`);
  L(`Tu madre es ${mom.first} (${mom.age} años) y tu padre, ${dad.first} (${dad.age}).`);
  const sib=p.rels.filter(r=>r.role==='sibling');
  if(sib.length)L(`En casa te espera${sib.length>1?'n':''} ${sib.map(s=>`${s.first}, ${s.sex==='F'?'tu hermana':'tu hermano'} de ${s.age}`).join(' y ')}.`);
  tab='vida';save();render();closeModal();
}
function continueAs(kid){
  const old=p, kids=kidsOf();
  const share=heirShare(old,kid,kids);
  const pt=old.rels.find(r=>(r.role==='spouse'||r.role==='partner'));
  const np=baseLife({first:kid.first,sex:kid.sex,c:old.c,last:kid.last,age:kid.age,money:share,born:(old.born??NOW)+old.age-kid.age,inherit:old.traits,kidSt:kid.st,langs:old.langs,av:kid.av});
  np.rels.push({id:uid(),role:'parent',sex:old.sex,first:old.first,last:old.last,age:old.age,bond:kid.bond,alive:false,loo:old.s.loo});
  if(pt)np.rels.push({...pt,role:'parent',id:uid()});
  kids.filter(k=>k!==kid).forEach(k=>np.rels.push({...k,role:'sibling',id:uid()}));
  (old.grand||[]).filter(x=>x.pid===kid.id).forEach(x=>np.rels.push({id:uid(),role:'child',sex:x.sex,first:x.first,last:kid.last,age:x.age,bond:R(70,95),alive:true,loo:R(20,95)}));
  if(np.age>=18)np.edu=2;else if(np.age>=12){np.edu=1;np.school='Secundaria'}else if(np.age>=6)np.school='Primaria';
  if(kid.major){np.edu=3;np.major=kid.major;np.uniType=kid.uniType}
  if(kid.uni)np.uni={...kid.uni};
  if(kid.job){const jj=JOBS.find(x=>x.t[0]===kid.job.t[0]);np.job={t:kid.job.t,e:jj?.e||'💼',sal:kid.job.sal,perf:60,yrs:0,pt:false,lvl:0,fam:!!jj?.fam,music:!!jj?.music};np.everJob=true}
  np.foll=Math.round(old.foll*.05);if(kid.ma){np.ma=kid.ma;np.maStyle='Kárate'}
  S.lineage=S.lineage||[];S.lineage.push({n:`${old.first} ${old.last}`,born:old.born??NOW,age:old.age,rib:old.ribbon?.[0]||'🕊️'});
  p=np;S.p=p;S.gen++;queue.length=0;
  L(`🧬 Tras la muerte de ${old.first}, sigues tu vida como ${p.first}. Generación ${S.gen}.`,'good');
  if(share>0)L(`Heredas ${fmt(share)}.`,'money');
  else if(old.will&&old.will!=='split')L('📜 El testamento no te deja nada. Hay peleas en la familia.','bad');
  tab='vida';save();render();closeModal();
}

/* ---------- cárcel, fama, emigrar ---------- */
function goJail(y,why){
  p.jail={left:y,total:y,appealed:false};p.record++;p.fugitive=false;grant('arrest');
  p.job=null;p.uni=null;if(p.pol)p.pol.o=-1;
  const pt=partner();if(pt)pt.bond-=25;parents().forEach(r=>r.bond-=10);st('hap',-20);
  return `🚔 Te detienen por ${why}. Te condenan a ${y} ${y===1?'año':'años'} ${p.age<18?'en un centro de menores':'de prisión'}.`;
}
function release(){p.jail=null;st('hap',10)}
function followGain(mult){
  let n=Math.round((10+p.s.loo/4+fame())*R(2,12)*mult*(has('funny')?1.3:1));
  const viral=chance(.04+fame()/500);if(viral)n*=R(20,80);
  p.foll+=n;return [n,viral];
}
function emigrateTo(i){
  const from=COUNTRIES[p.c].n;p.c=i;p.undoc=false;inc('countries');grant('emig');
  if(p.job){p.job=null}
  p.rels.filter(r=>r.role==='friend').forEach(r=>r.bond-=20);
  st('hap',R(-4,8));
  return `✈️ Te mudas de ${from} a ${COUNTRIES[i].n}. Toca empezar de cero.`+(speaks(langOf(i))?'':` Aquí se habla ${langOf(i).toLowerCase()} y apenas lo entiendes.`);
}
const otherCountry=()=>{let i;do i=R(0,COUNTRIES.length-1);while(i===p.c);return i};

function randomEvent(){
  const ok=EVENTS.filter(e=>p.age>=e.min&&p.age<=e.max&&!!e.jail===!!p.jail&&(!e.cond||e.cond())&&e!==S.lastEv);
  if(!ok.length)return null;
  const tot=ok.reduce((s,e)=>s+(e.w||1),0);let r=Math.random()*tot;
  for(const e of ok){r-=(e.w||1);if(r<=0)return e}return ok[0];
}
function pushEvent(ev){ev._t=ev.txt();queue.push(ev)}
function runQueue(){
  const ev=queue[0];if(!ev){closeModal();return}
  if(ev.death){showDeath();return}
  if(ev.cond&&!ev.cond()){queue.shift();return runQueue()}
  const map={};
  ev.ch.forEach((c,i)=>map['c'+i]=()=>{
    const res=c[1]();L(res);S.lastEv=EVENTS.includes(ev)?ev:S.lastEv;save();render();
    openModal(`<p class="res">${res}</p><div class="choices"><button class="btn" data-k="ok">Continuar</button></div>`,{ok:()=>{queue.shift();runQueue()}},false);
  });
  if(['🌍','🌊','☄️','⚔️'].some(x=>(ev._t||'').startsWith(x)||(ev.title||'').startsWith(x)))shake();
  openModal(`<p class="eyebrow">${p.age} años</p><h2>${ev.title||(p.jail?'⛓️ En prisión':'🎲 Algo pasa')}</h2><p>${ev._t}</p><div class="choices">${ev.ch.map((c,i)=>{const lb=typeof c[0]==='function'?c[0]():c[0];return lb?`<button class="btn ghost" data-k="c${i}">${lb}</button>`:''}).join('')}</div>`,map,false);
}
function special(title,txt,ch,cond){queue.push({title,_t:txt,ch,cond})}
function enroll(m,t='pub'){p.uni={m:m.n,left:m.y,type:t};if(p.job&&!p.job.pt)p.job=null;return `${MAJOR_E[m.n]||'🎓'} Te matriculas en ${m.n}. Te esperan ${m.y} años de estudio.`}
function retire(){p.pension=p.job.sal*.6;p.job=null;p.retired=true;st('hap',10);return `🏖️ Te jubilas. Cobrarás ${fmt(p.pension)} al año.`}
function jobCap(j){const known={Agente:50000,Astronauta:80000,Soldado:20000};const b=j.base??JOBS.find(x=>x.t[0]===j.t[0])?.sal??known[j.t[0].split(' ')[0]]??j.sal/W();return b*W()*3}
function hire(j,extra={}){p.job={base:j.sal,t:j.t,e:j.e,sal:j.sal*W()*(.9+Math.random()*.2)*(p.undoc?.7:1)*(speaks(langOf(p.c))?1:.8)*(j.major&&j.major===p.major?UT(p.uniType).mult:1),perf:60,yrs:0,pt:!!j.pt,lvl:0,fam:!!j.fam,music:!!j.music,...extra};p.everJob=true;st('hap',6)}

/* ---------- pasar el año ---------- */
function ageUp(){
  if(!p.alive){newLifeForm();return}
  if(queue.length)return;
  p.age++;p.used={};yearEntry();sfx('tick');
  const a=p.age;
  if(a===1)L(pick(['Dices tu primera palabra: «agua».','Das tus primeros pasos agarrado al sofá.','Dices «mamá» por primera vez.']));
  if(a===3)L('🧸 Empiezas la guardería. Lloras el primer día.');
  yearLife(a);
  // cárcel
  if(p.jail){p.jail.left--;if(p.jail.left<=0){release();L('🔓 Cumples tu condena y sales en libertad.','good')}else L(`⛓️ Te quedan ${p.jail.left} ${p.jail.left===1?'año':'años'} entre rejas.`)}
  if(p.fugitive&&chance(.2))L(goJail(R(3,6),'fugarte de prisión'),'bad');
  if(p.undoc&&!p.jail){p.undocYrs=(p.undocYrs||0)+1;
    if(chance(.1)){const from=COUNTRIES[p.c].n;p.c=p.homeC??otherCountry();p.undoc=false;p.job=null;st('hap',-15);L(`🚨 Te detienen en una redada en ${from} y te deportan a ${COUNTRIES[p.c].n}.`,'bad')}
    else if(p.undocYrs>=5&&chance(.15)){p.undoc=false;grant('papers');st('hap',12);L(`📄 Una regularización masiva te da papeles en ${COUNTRIES[p.c].n}.`,'good')}}
  // familia
  for(const r of p.rels){
    if(!r.alive||r.role==='ex')continue;
    r.age++;r.bond=clamp(r.bond-R(0,3),0,100);
    const d=r.vamp?0:r.age<18?.0005:r.age<60?.002:Math.pow((r.age-55)/45,3)*.6;
    if(chance(d)){r.alive=false;r.cause=relCause(r);L(`${label(r)}: ${r.first} fallece a los ${r.age} años por ${r.cause}.`,'bad');st('hap',-(['parent','spouse','child'].includes(r.role)?R(12,25):R(4,10)));continue}
    if(r.role==='partner'&&r.bond<20&&chance(.4)){r.role='ex';L(`💔 ${r.first} te deja. Dice que ya no siente lo mismo.`,'bad');st('hap',-10)}
    if(r.role==='child'&&r.age===18)L(`${r.first} cumple 18 y se va a vivir por su cuenta.`);
  }
  p.rels=p.rels.filter(r=>r.role!=='ex');
  for(const pet of p.pets){pet.age++;if(pet.age>R(10,17)){pet.gone=true;L(`Tu ${pet.kind} ${pet.n} muere de viejo. Le enterráis en el jardín.`,'bad');st('hap',-8)}}
  p.pets=p.pets.filter(x=>!x.gone);
  // estudios

function zStep(z){
  if(z.hp<=0){st('hap',-5);return done('🧟 Los zombis te rodean… y te despiertas sudando en tu cama. Ha sido una pesadilla muy real.')}
  if(z.day>6){st('hap',20);grant('zombie');return done(`🏁 ¡Llegas al refugio con ${z.group} ${z.group===1?'persona':'personas'} en el grupo${z.dog?' y tu perro':''}! Sobrevives al apocalipsis.`)}
  const sc=pick(ZSC),map={},stats=()=>`❤️ Vida ${z.hp} · 🥫 Comida ${Math.max(0,z.food)} · ⛽ Gasolina ${Math.max(0,z.fuel)} · 👥 Grupo ${z.group}`;
  sc.ch.forEach((c,i)=>map['z'+i]=()=>{let r=c[1](z);
    if(z.food>0)z.food--;else{z.hp--;r+=' No queda comida y el hambre aprieta.'}
    if(z.fuel>0)z.fuel--;else{r+=' Sin gasolina, seguís a pie.';if(chance(.3))z.hp--}
    if(z.dog&&chance(.2))z.hp=Math.min(z.hp+1,5);z.day++;
    openModal(`<p class="res">${r}</p><p class="note">${stats()}</p><div class="choices"><button class="btn" data-k="go">Seguir</button></div>`,{go:()=>zStep(z)},false)});
  openModal(`<p class="eyebrow">🧟 Día ${z.day} de 6</p><h2>Road trip zombi</h2><p>${sc.t}</p><p class="note">${stats()}</p><div class="choices">${sc.ch.map((c,i)=>`<button class="btn ghost" data-k="z${i}">${c[0]}</button>`).join('')}</div>`,map,false);
}

function yearSpecial(){let e=0;
  const P=p.pol;
  if(P&&P.o>=0){const o=OFFICES[P.o];e+=o.sal*W();P.term--;P.appr=clamp(P.appr+R(-6,4),0,100);
    if(P.appr<15&&chance(.35)){L(`🏛️ Te destituyen como ${LV(o.n).toLowerCase()} por tu bajísima aprobación.`,'bad');P.o=-1}
    else if(P.term<=0){
      if(P.o===4&&P.terms>=2){L('🎖️ Terminas tu segundo mandato al frente del país. Toca retirarse.');P.o=-1}
      else if(chance(P.appr/100+.1)){P.term=4;P.terms++;L(`🗳️ ¡Te reeligen como ${LV(o.n).toLowerCase()}!`,'good')}
      else{L(`🗳️ Pierdes la reelección como ${LV(o.n).toLowerCase()}.`,'bad');P.o=-1}}}
  const C=p.cult;
  if(C){C.foll+=Math.round(C.foll*(C.temple?.22:.08)*(C.trust/60))+R(0,4);C.trust=clamp(C.trust+R(-4,3),0,100);
    if(C.foll>300&&C.trust<30&&chance(.25)){L(goJail(R(1,4),`estafar a los seguidores de ${C.n}`),'bad');p.cult=null}
    else{const d=C.foll*.5;e+=d;L(`🕯️ ${C.n}: ${cfmt(C.foll)} seguidores. Donativos: ${fmt(d)}.`,'money')}}
  const Z=p.zoo;
  if(Z){const appeal=ANIMALS.reduce((s,x)=>s+(Z.an[x.k]||0)*x.a,0);
    const vis=Math.round((5000+appeal*300)*(Z.rep/50)*[0,1.3,1,.7][Z.price]),inc2=vis*[0,8,12,20][Z.price]*W();
    const net=inc2-(100000+ANIMALS.reduce((s,x)=>s+(Z.an[x.k]||0)*x.v*.08,0));e+=net;
    Z.rep=clamp(Z.rep-R(0,4)+(Z.price===1?2:Z.price===3?-2:0),0,100);
    L(`🦁 Tu zoo recibe ${cfmt(vis)} visitas y ${net>=0?'gana':'pierde'} ${fmt(Math.abs(net))}.`,net>=0?'good':'bad');
    if((Z.an.lion||Z.an.tiger||Z.an.croc)&&chance(.05)){Z.rep=clamp(Z.rep-15,0,100);L('🚨 ¡Se escapa un animal peligroso del zoo! Sale en todas las noticias.','bad')}}
  const V=p.vamp;
  if(V){V.yrs++;if(!V.fed){st('hea',-R(15,30));L('🩸 No te has alimentado este año y te debilitas.','bad')}V.fed=false;st('loo',1)}
  if(p.job?.astro&&p.job.yrs===2)L('🚀 Terminas el entrenamiento. Ya eres astronauta y puedes ir a misiones.','good');
  return e;

async function submitHall(){try{if(!HALLDB||!HALLUSER)return;const uid=await HALLUSER.id();if(!uid)return;

  const all=[...(Array.isArray(cur.lives)?cur.lives:[]),entry],keep=new Set();

  if(p.daily===today&&(!daily||p.age>daily.age))daily={d:today,age:p.age,w:Math.round(worth()),n:entry.n};

  {t:['Contable','Contable'],s:37000},{t:['Arquitecto','Arquitecta'],s:44000},{t:['Policía','Policía'],s:27000},{t:['Diseñador','Diseñadora'],s:27000}];

/* ---------- artes marciales y asesinato ---------- */
const MA_STYLES=['Kárate','Judo','Taekwondo','Kung-fu','Krav magá','Jiu-jitsu','Capoeira','Muay thai','Aikido'];
const BELTS=['Blanco','Amarillo','Naranja','Verde','Azul','Marrón','Negro'];
function belt(){return BELTS[Math.min(6,Math.floor((p.ma||0)/15))]}
const maCost=()=>p.age<18?0:300;
function fight(diff){return chance(clamp(.12+(p.ma||0)/100-diff+(p.athl-50)/400,.05,.95))}
function maOpt(t){return ()=>(p.ma||0)>=10&&p.maStyle?`🥋 ${t} con ${p.maStyle.toLowerCase()} (cinturón ${belt().toLowerCase()})`:null}
function maTrainOnce(){use('matrain');const before=belt();
  const gain=Math.max(1,R(3,7)+(has('athletic')?2:0)-(has('lazy')?2:0));p.ma=Math.min(100,(p.ma||0)+gain);
  p.athl=clamp(p.athl+2,0,100);st('hea',1);addStress(-4);
  if(belt()!==before){celebrate();return done(`🥋 ¡Pasas el examen de ${p.maStyle.toLowerCase()} y consigues el cinturón ${belt().toLowerCase()}! Nivel ${p.ma}/100.`)}
  return done(`🥋 Entrenas ${p.maStyle.toLowerCase()} en el dojo. Nivel ${p.ma}/100 · cinturón ${belt().toLowerCase()}.`)}
function maStylePick(then){const map={};MA_STYLES.forEach((s,i)=>map['s'+i]=()=>{const keep=p.maStyle&&p.maStyle!==s;p.maStyle=s;if(keep)p.ma=Math.round((p.ma||0)*.6);then?then():(save(),render(),result(`🥋 Ahora entrenas ${s.toLowerCase()}.${keep?' Parte de lo aprendido te sirve.':''}`))});
  openModal(`<p class="eyebrow">🥋 Artes marciales</p><h2>¿Qué estilo quieres aprender?</h2><p class="muted">Cuanto más nivel tengas, más fácil será defenderte si alguien te ataca.${p.maStyle?' Si cambias de estilo, conservas parte de tu nivel.':''}</p><div class="choices">${MA_STYLES.map((s,i)=>`<button class="btn ghost" data-k="s${i}">${s}${p.maStyle===s?' (actual)':''}</button>`).join('')}</div>`,map)}
X.ma=a=>{
  if(a==='train'){const go=()=>{if(maCost()&&!pay(maCost()))return result(`Las clases cuestan ${fmt(maCost())}.`);maTrainOnce()};return p.maStyle?go():maStylePick(go)}
  if(a==='style')return maStylePick();
  if(a==='tourn'){use('matourn');if(chance(clamp((p.ma||0)/120,.05,.9))){const pr=Math.round(R(200,3000)*((p.ma||0)/30)*W());p.money+=pr;st('hap',8);p.foll+=R(50,3000);return done(`🏆 ¡Ganas el torneo de ${p.maStyle.toLowerCase()}! Premio: ${fmt(pr)}.`)}
    st('hea',-R(0,5));return done(`🥋 Caes en ${pick(['cuartos de final','semifinales','la final'])} del torneo. El año que viene será.`)}
};
function renderMA(){if(p.age<5)return '';
  return banner('🥋 Artes marciales',p.maStyle?`${p.maStyle} · cinturón ${belt().toLowerCase()} · nivel ${p.ma||0}/100. Te ayuda a defenderte si te atacan.`:'Elige un estilo y entrena. Te servirá para defenderte si alguien te ataca.',
    btn('ma','train',p.maStyle?`Entrenar${maCost()?` (${fmt(maCost())})`:''}`:'Elegir estilo y empezar',full('matrain'))+(p.maStyle?btn('ma','tourn','🏆 Torneo',(p.ma||0)<40||full('matourn'),1)+btn('ma','style','Cambiar de estilo',0,1):''))}

X.murder=()=>{const map={},tg=p.rels.filter(r=>r.alive&&r.role!=='ex');
  tg.forEach(r=>map['r'+r.id]=()=>murderConfirm(r));map.stranger=()=>murderConfirm(null);
  openModal(`<p class="eyebrow">☠️ Asesinato</p><h2>¿A quién?</h2><p class="muted">Es el delito más grave del juego: si te pillan, pasarás décadas en la cárcel, y tu karma y tu familia nunca lo olvidarán.</p><div class="choices">${tg.map(r=>`<button class="btn ghost" data-k="r${r.id}">${relE(r)} ${r.first} · ${label(r).toLowerCase()}</button>`).join('')}<button class="btn ghost" data-k="stranger">👤 Un desconocido</button><button class="btn" data-k="x">Cancelar</button></div>`,{...map,x:closeModal})};
function murderConfirm(t){const who=t?t.first:'un desconocido';
  openModal(`<p class="eyebrow">☠️ No hay vuelta atrás</p><h2>¿Seguro?</h2><p>Vas a acabar con la vida de ${who}. No se puede deshacer.</p><div class="choices"><button class="btn" data-k="no">No, me arrepiento</button><button class="btn ghost" data-k="yes">Sí, hacerlo</button></div>`,{
    no:()=>done('Te lo piensas mejor y te vas a casa. Menos mal.'),yes:()=>done(murder(t))},false)}
function murder(t){use('cmurder');p.karma-=25;addStress(30);inc('murders');st('hap',-15);
  const who=t?t.first:'un desconocido';
  if(t){t.alive=false;t.killed=true;
    p.rels.forEach(r=>{if(r!==t&&r.alive&&['parent','sibling','child','spouse','partner'].includes(r.role))r.bond=clamp(r.bond-15,0,100)})}
  const caught=clamp(.65-(p.s.sma-50)/200-(p.mob?p.mob.rank*.06:0)+(t?.1:0),.15,.9);
  if(chance(caught))return goJail(p.age<18?R(3,6):R(20,45),`el asesinato de ${who}`);
  if(p.mob)mobResp(10);
  return `La policía investiga la muerte de ${who}, pero nunca encuentra al culpable. Tú sabes la verdad, y no te deja dormir.`}

/* ---------- universidades y futuro de los hijos ---------- */
const UNI_TYPES=[{k:'pub',e:'🏛️',n:'Pública',c:1800,mult:1,hire:0,d:'Barata, sueldos normales'},
  {k:'priv',e:'🎓',n:'Privada',c:9000,mult:1.15,hire:.1,d:'Sueldos un 15 % más altos y más facilidad para encontrar trabajo'},
  {k:'elite',e:'🏰',n:'De élite',c:25000,mult:1.35,hire:.2,min:75,d:'Sueldos un 35 % más altos y los mejores puestos'}];
function UT(k){return UNI_TYPES.find(x=>x.k===(k||'pub'))||UNI_TYPES[0]}
function uniTypePick(mn,years,sma,title,cb){const map={};
  UNI_TYPES.forEach(t=>map[t.k]=()=>cb(t.k));
  openModal(`<p class="eyebrow">${title}</p><h2>¿Qué universidad?</h2><p class="muted">${MAJOR_E[mn]||'🎓'} ${mn} · ${years} años. Se paga cada año de carrera.</p><div class="choices">${UNI_TYPES.map(t=>{const no=t.min&&sma<t.min;return `<button class="btn ghost" data-k="${t.k}" ${no?'disabled':''}>${t.e} ${t.n} · ${fmt(t.c*W())} al año (${fmt(t.c*W()*years)} en total) · ${no?`necesita inteligencia ${t.min}`:t.d}</button>`}).join('')}</div>`,map)}
function kidSma(r){return (r.st||(r.st={sma:R(20,90),hea:R(70,100),loo:R(20,90),hap:R(60,95)})).sma}
function pickWant(r){const s=kidSma(r);let m=pick(MAJORS).n;if(s<55&&['Medicina','Ingeniería','Derecho','Arquitectura'].includes(m))m=pick(MAJORS).n;r.want=m;return m}
function kidEnroll(r,t,mn=r.want||pickWant(r)){const m=MAJORS.find(x=>x.n===mn)||MAJORS[0],T=UT(t);
  if(T.min&&kidSma(r)<T.min)return `${r.first} no llega a la nota para una universidad de élite.`;
  r.uni={m:m.n,left:m.y,type:t};r.asked=true;r.bond=clamp(r.bond+5,0,100);
  return `${MAJOR_E[m.n]||'🎓'} ${r.first} empieza ${m.n} en una universidad ${T.n.toLowerCase()}. Pagarás ${fmt(T.c*W())} al año durante ${m.y} años.`}
function kidJob(r){r.jobChecked=true;const s=kidSma(r);
  const byMajor=r.major&&JOBS.filter(j=>j.major===r.major&&(!j.sma||s>=j.sma)&&j.min<=Math.max(r.age,24)).sort((a,b)=>a.sal-b.sal)[0];
  const j=byMajor||pick(JOBS.filter(x=>!x.major&&!x.pt&&!x.hard&&!x.fame&&!x.sma&&!x.hea));
  if(!byMajor&&chance(.15)){r.job=null;return}
  const mult=byMajor?UT(r.uniType).mult:1;
  r.job={t:j.t,sal:j.sal*W()*mult*(.85+Math.random()*.3)*(1+(s-60)/200)}}
const kTitle=r=>r.job?r.job.t[r.sex==='F'?1:0]:'';
function kidInfo(r){if(!r.alive||r.role!=='child')return '';
  if(r.uni)return ` · 🎓 ${r.uni.m} (${UT(r.uni.type).n.toLowerCase()})`;
  if(r.job)return ` · 💼 ${kTitle(r).toLowerCase()} (${fmt(r.job.sal)}/año)`;
  if(r.major)return ` · 🎓 ${r.major}`;
  if(r.want&&r.age>=12)return ` · sueña con estudiar ${r.want.toLowerCase()}`;
  return ''}
function kidsUniYear(){
  for(const r of kidsOf()){const s=r.st||(r.st={sma:R(20,90),hea:R(70,100),loo:R(20,90),hap:R(60,95)});
    if(r.age===12&&!r.want)L(`🎒 ${r.first} dice que de mayor quiere estudiar ${pickWant(r).toLowerCase()}.`);
    else if(r.age===15&&r.want&&chance(.25)){const o=r.want;pickWant(r);if(r.want!==o)L(`🎒 ${r.first} cambia de idea: ahora quiere estudiar ${r.want.toLowerCase()}.`)}
    if(r.age===18&&!r.asked&&!r.uni&&!r.major&&!p.jail){r.asked=true;const w=r.want||pickWant(r),m=MAJORS.find(x=>x.n===w)||MAJORS[0],sma=kidSma(r);
      const ch=UNI_TYPES.filter(t=>!t.min||sma>=t.min).map(t=>[`${t.e} Universidad ${t.n.toLowerCase()} · ${fmt(t.c*W())} al año`,()=>kidEnroll(r,t.k)]);
      ch.push(['💼 Que se ponga a trabajar',()=>{kidJob(r);return r.job?`${r.first} empieza a trabajar de ${kTitle(r).toLowerCase()}.`:`${r.first} busca trabajo, pero de momento no encuentra nada.`}]);
      special(`🎓 La universidad de ${r.first}`,`${r.first} termina el instituto con una nota de ${(sma/10).toFixed(1)} y quiere estudiar ${w} (${m.y} años). ¿Dónde estudia?${sma<75?' Con su nota no le admiten en una de élite.':''}`,ch,()=>r.alive&&!r.uni)}
    if(r.uni){const T=UT(r.uni.type),c=T.c*W();
      if(!p.jail){if(pay(c))L(`🎓 Matrícula de ${r.first} (${r.uni.m}, ${T.n.toLowerCase()}): ${fmt(c)}.`,'money');else{p.debt+=c;L(`🎓 No te llega para la matrícula de ${r.first}: ${fmt(c)} pasan a deuda.`,'bad')}}
      s.sma=clamp(s.sma+R(0,2),0,100);
      if(s.sma<40&&chance(.1)){L(`🎓 ${r.first} deja la carrera de ${r.uni.m}.`,'bad');r.uni=null;r.asked=true;continue}
      if(--r.uni.left<=0){r.major=r.uni.m;r.uniType=r.uni.type;r.uni=null;kidJob(r);
        L(`🎓 ${r.first} se gradúa en ${r.major} en una universidad ${T.n.toLowerCase()}${r.job?` y consigue trabajo de ${kTitle(r).toLowerCase()} (${fmt(r.job.sal)} al año)`:''}.`,'good');st('hap',8)}}
    else if(r.age>=19&&!r.job&&!r.jobChecked){kidJob(r);if(r.job)L(`💼 ${r.first} encuentra trabajo de ${kTitle(r).toLowerCase()}.`)}
    if(r.job)r.job.sal*=1.03}}
function kidUniPick(r){const map={};
  MAJORS.forEach((m,i)=>map['m'+i]=()=>uniTypePick(m.n,m.y,kidSma(r),`🎓 Universidad de ${r.first}`,t=>done(kidEnroll(r,t,m.n))));
  openModal(`<p class="eyebrow">🎓 Universidad de ${r.first}</p><h2>¿Qué estudia?</h2><p class="muted">${r.want?`Su sueño es estudiar ${r.want.toLowerCase()}. Si le obligas a otra cosa, os llevaréis peor.`:'Todavía no sabe qué quiere estudiar.'}</p><div class="choices">${MAJORS.map((m,i)=>`<button class="btn ghost" data-k="m${i}">${MAJOR_E[m.n]} ${m.n} · ${m.y} años${r.want===m.n?' · ⭐ lo que quiere':''}</button>`).join('')}</div>`,map)}

/* ---------- gestión de negocios ---------- */
let EVB=null;
function bizInit(b){if(!b)return b;b.id=b.id||uid();b.q??=50;b.mk??=30;b.pr??=2;b.st??=2;b.mg??=false;b.hp??=70;return b}
function evb(f){return ()=>p.biz.includes(EVB)?f(bizInit(EVB)):'Ya no tienes ese negocio.'}
function bizYear(b){bizInit(b);b.yrs=(b.yrs||0)+1;const mgr=b.mg?b.v*.03:0;
  if(b.su){if(chance(.08*(1+b.q/100))){b.v*=R(5,20);b.last=-mgr;b.hp=Math.min(100,b.hp+30);b.su=false;b.rate=.15;b.risk=.3;b.n='Empresa tecnológica';L(`🚀 ¡Tu startup se dispara y se convierte en una empresa tecnológica de verdad! Ahora vale ${fmt(b.v)}.`,'good')}
    else{b.last=-b.v*.08-mgr;b.hp=clamp(b.hp-R(8,18)*(b.mg?.7:1),0,100)}}
  else{const dem=(.6+b.q/125)*(.75+b.mk/200)*[0,1.25,1,.75][b.pr]*[0,.8,1,1.15][b.st],mar=[0,.7,1,1.35][b.pr];
    b.last=b.v*b.rate*.6*dem*mar*(1+(Math.random()*2-1)*b.risk*1.6)*(has('business')?1.3:1)-b.v*[0,-.02,0,.03][b.st]-mgr;
    b.v*=.97+Math.random()*.06+(b.q-50)/2000;
    b.hp=clamp(b.hp+(b.last>=0?R(4,10):-R(10,22)),0,100)}
  b.mk=Math.max(0,b.mk-R(5,12));
  if(!b.mg&&!b.worked)b.q=Math.max(0,b.q-R(2,5));b.worked=false;
  if(b.hp<=0){b.dead=true;L(`💥 ${b.e} Tu negocio (${b.n.toLowerCase()}) lleva demasiado tiempo en pérdidas y cierra.`,'bad');return}
  if(b.hp<=30)L(`🚨 ${b.e} Tu negocio (${b.n.toLowerCase()}) está en apuros (salud ${b.hp}/100). Gestiónalo en 🏠 Bienes o podría cerrar.`,'bad');
}
function bizManage(i){const b=bizInit(p.biz[i]);if(!b)return;const k=b.id,PR=['','baratos','normales','caros'],ST=['','pocos','normales','muchos'];
  const cost=(f,t,go)=>()=>{const c=b.v*f;if(!pay(c))return result(`${t} cuesta ${fmt(c)}.`);go(c)};
  const re=t=>{toast(t);save();render();bizManage(i)};
  const map={
    work:()=>{use('bw'+k);b.worked=true;b.q=clamp(b.q+R(3,8),0,100);b.hp=clamp(b.hp+R(2,6),0,100);addStress(R(3,6));done(`${b.e} Echas muchas horas en tu negocio. Calidad ${b.q}/100.`)},
    mkt:cost(.03,'La campaña',()=>{use('bm'+k);b.mk=clamp(b.mk+R(15,30),0,100);done(`📣 Lanzas una campaña de publicidad. Marketing ${b.mk}/100.`)}),
    train:cost(.02,'La formación',()=>{use('bt'+k);b.q=clamp(b.q+R(5,12),0,100);done(`🎓 Formas a tu equipo. Calidad ${b.q}/100.`)}),
    renov:cost(.1,'La reforma',()=>{use('br'+k);b.q=clamp(b.q+R(10,20),0,100);b.v*=1.05;done(`🛠️ Reformas el local. Calidad ${b.q}/100 y ahora vale ${fmt(b.v)}.`)}),
    rescue:cost(.1,'Inyectar dinero',c=>{b.hp=clamp(b.hp+R(25,40),0,100);done(`💵 Inyectas ${fmt(c)} en tu negocio. Salud ${b.hp}/100.`)}),
    grow:cost(.5,'Ampliarlo',()=>{b.v*=1.5;done(`📈 Amplías tu negocio. Ahora vale ${fmt(b.v)}.`)}),
    staff:()=>{b.st=b.st%3+1;re(`👥 Plantilla: ${ST[b.st]}`)},
    price:()=>{b.pr=b.pr%3+1;re(`💰 Precios ${PR[b.pr]}`)},
    mgr:()=>{b.mg=!b.mg;re(b.mg?'🧑‍💼 Contratas a un gerente':'🧑‍💼 Despides al gerente')},
    sell:()=>{p.biz.splice(i,1);p.money+=b.v;done(`${b.e} Vendes tu negocio (${b.n.toLowerCase()}) por ${fmt(b.v)}.`)},
    x:closeModal};
  const B=(key,label,dis,ghost=1)=>`<button class="btn ${ghost?'ghost':''}" data-k="${key}" ${dis?'disabled':''}>${label}</button>`;
  openModal(`<p class="eyebrow">⚙️ Gestionar negocio</p><h2>${b.e} ${b.n}</h2>
    <dl class="sum"><dt>💎 Valor</dt><dd>${fmt(b.v)}</dd><dt>📊 Último año</dt><dd>${b.yrs?`${b.last>=0?'+':''}${fmt(b.last)}`:'recién abierto'}</dd>
    <dt>❤️ Salud</dt><dd>${b.hp}/100${b.hp<=30?' · 🚨 en apuros':''}</dd><dt>⭐ Calidad</dt><dd>${b.q}/100</dd><dt>📣 Marketing</dt><dd>${b.mk}/100</dd>
    <dt>👥 Plantilla</dt><dd>${ST[b.st]}</dd><dt>💰 Precios</dt><dd>${PR[b.pr]}</dd><dt>🧑‍💼 Gerente</dt><dd>${b.mg?`sí (${fmt(b.v*.03)} al año)`:'no'}</dd></dl>
    <p class="note">La calidad y el marketing atraen clientes. Precios baratos: más clientes y menos margen; caros: al revés. Más plantilla vende más, pero cuesta más. Sin gerente, la calidad baja cada año si no trabajas tú en el negocio. Solo cierra si la salud llega a 0, y te avisamos antes.</p>
    <div class="choices">
    ${B('work','🧑‍💼 Trabajar en el negocio (gratis, más estrés)',full('bw'+k),0)}
    ${B('mkt',`📣 Campaña de marketing (${fmt(b.v*.03)})`,full('bm'+k)||p.money<b.v*.03)}
    ${B('train',`🎓 Formar al personal (${fmt(b.v*.02)})`,full('bt'+k)||p.money<b.v*.02)}
    ${B('renov',`🛠️ Reformar el local (${fmt(b.v*.1)})`,full('br'+k)||p.money<b.v*.1)}
    ${B('staff',`👥 Cambiar plantilla (ahora: ${ST[b.st]})`)}
    ${B('price',`💰 Cambiar precios (ahora: ${PR[b.pr]})`)}
    ${B('mgr',b.mg?'🧑‍💼 Despedir al gerente':`🧑‍💼 Contratar un gerente (${fmt(b.v*.03)} al año)`)}
    ${B('rescue',`💵 Inyectar dinero (${fmt(b.v*.1)}): +salud`,p.money<b.v*.1)}
    ${B('grow',`📈 Ampliar (${fmt(b.v*.5)})`,p.money<b.v*.5)}
    ${B('sell',`💸 Vender por ${fmt(b.v)}`)}
    ${B('x','Cerrar',0,0)}</div>`,map)}

/* ---------- lo que cuesta cada cosa al año ---------- */
function assetTax(x){return x.k==='house'?x.v*.005:['car','moto','boat','plane'].includes(x.k)?x.v*.01:0}
function assetYear(a){const tax=p.jail?0:assetTax(a),up=a.m||0,rent=a.rent?a.v*.045:0,rate=a.d==='art'?1.03:(a.d||DEP[a.k]||.95),dv=a.v*(rate-1);
  return {tax,up,rent,dv,net:rent-tax-up+dv}}
function marginal(x){const b=[12000,35000,70000].map(v=>v*W());return x>b[2]?.42:x>b[1]?.3:x>b[0]?.2:0}
function assetLine(a){const y=assetYear(a);
  return `<small>Vale ${fmt(a.v)} · balance anual <b class="${y.net>=0?'pos':'neg'}">${y.net>=0?'+':''}${fmt(y.net)}</b></small><small>${[y.tax>=1?`🧾 impuesto ${fmt(y.tax)}`:'',y.up>=1?`🔧 mantenimiento ${fmt(y.up)}`:'',y.rent?`🏘️ alquiler +${fmt(y.rent)}`:'',`${y.dv>=0?'📈 gana':'📉 pierde'} ${fmt(Math.abs(y.dv))} de valor`].filter(Boolean).join(' · ')}</small>`}
function assetSummary(){let tax=0,up=0,rent=0,worst=null;
  for(const a of p.assets){const y=assetYear(a);tax+=y.tax;up+=y.up;rent+=y.rent;if(y.net<0&&(!worst||y.net<worst.y.net))worst={a,y}}
  return `<p class="note">Cada año tus bienes te cuestan ${fmt(tax)} en impuestos y ${fmt(up)} en mantenimiento${rent?`, y te dan ${fmt(rent)} de alquileres`:''}. El balance incluye lo que gana o pierde de valor cada cosa.${worst?` Lo que más te cuesta: ${assetE(worst.a)} ${worst.a.n.toLowerCase()} (${fmt(-worst.y.net)} al año).`:''}</p>`}
function taxDetail(){const lt=p.lastTax;if(!lt||!lt.parts)return '';const pr=lt.parts;

const RISKY={'Policía':[.003,'un tiroteo durante una persecución policial'],'Bombero':[.003,'el derrumbe de un edificio en llamas durante un rescate'],
  'Electricista':[.002,'una descarga eléctrica mientras trabajaba'],'Mecánico':[.0015,'un coche que se le cayó encima en el taller'],
  'Repartidor':[.002,'un accidente con la moto de reparto'],'Piloto de avión':[.002,'un accidente de avión'],'Cocinero':[.0005,'un incendio en la cocina del restaurante']};
function jobRisk(){const j=p.job;if(!j||p.jail)return null;
  if(j.mil)return [.004,BR(j).die[0],BR(j).die[1]];
  if(j.agent)return [.004,'una misión secreta que salió mal','Su familia nunca supo los detalles.'];
  if(j.astro)return [.002,'un fallo en la nave durante una misión espacial','Su nombre quedó grabado en la historia.'];
  if(j.sport==='Automovilismo'||j.sport==='Motociclismo')return [.005,`un accidente en plena carrera de ${j.sport.toLowerCase()}`,'Ocurrió en una curva a más de 250 km/h.'];
  if(j.sport==='Boxeo'||j.sport==='Artes marciales mixtas')return [.002,'un golpe en la cabeza durante un combate','Se desplomó en mitad del combate.'];
  const r=RISKY[j.t[0]];return r?[r[0],r[1],'Fue un accidente laboral.']:null}
function illCause(){const A=p.addict||{};
  if(p.vamp)return ['la luz del sol','Salió de casa a plena luz del día sin protegerse.'];
  if((A.hard||0)>=60)return ['una sobredosis','Llevaba tiempo enganchado a las drogas duras.'];
  if((A.pills||0)>=60)return ['una intoxicación por pastillas','Dependía de ellas desde hacía años.'];
  if((A.alcohol||0)>=60)return ['una cirrosis hepática','Llevaba años bebiendo demasiado.'];
  if((A.tobacco||0)>=60&&p.age>=40)return ['un cáncer de pulmón','Fumó durante muchos años.'];
  if(p.sick)return [`complicaciones de ${p.sick}`,'Nunca llegó a curarse del todo.'];
  if(p.chronic?.length)return [`complicaciones de su ${pick(p.chronic)}`,'Su salud llevaba tiempo deteriorándose.'];
  if((p.stress||0)>80)return ['un infarto','El estrés acumulado durante años acabó pasándole factura.'];
  if(p.jail)return ['una pelea en el patio de la cárcel','Recibió una paliza de la que no se recuperó.'];
  if(p.age>=70)return [pick(['un fallo cardíaco','una insuficiencia renal','una neumonía']),'Su cuerpo, ya muy débil, no aguantó más.'];
  return [pick(['una infección grave','una enfermedad del corazón','un cáncer']),'Su salud se fue deteriorando sin que se detectara a tiempo.']}
function accidentCause(){const o=[],own=k=>p.assets.some(a=>a.k===k);
  if(own('car')||p.license)o.push(['un accidente de tráfico',pick(['Un camión se saltó un semáforo en rojo.','Perdió el control del coche en una curva mojada.','Un conductor borracho invadió su carril.'])]);
  if(own('moto'))o.push(['un accidente de moto','Derrapó en una curva con gravilla.']);
  if(own('boat'))o.push(['un naufragio','Una tormenta le sorprendió en alta mar.']);
  if(own('plane'))o.push(['un accidente de avioneta','El motor falló poco después de despegar.']);
  if((p.cnt.party||0)>=5)o.push(['una intoxicación etílica','Bebió demasiado en una fiesta.']);
  if((p.ma||0)<10&&p.age>=16&&!p.jail)o.push(['un atraco que salió mal','Se resistió a un ladrón armado.']);
  if(p.age<14)o.push(['un accidente en el parque','Se cayó desde lo alto de un tobogán.'],['una meningitis','La infección avanzó muy deprisa.']);
  o.push(['un accidente doméstico',pick(['Se cayó por las escaleras de casa.','Una fuga de gas en la cocina.','Resbaló en la ducha y se golpeó la cabeza.'])],
    ['un atropello','Un coche no frenó en un paso de peatones.'],['un infarto fulminante','Tenía un problema de corazón que nadie había detectado.'],['un aneurisma','Fue algo repentino, sin ningún aviso.']);
  return pick(o)}
function ageCause(){return pick([['causas naturales','Se fue tranquilamente mientras dormía.'],['un infarto','Le dio mientras paseaba por el parque.'],['una neumonía','Un resfriado se complicó en pleno invierno.'],
  ['un ictus','Ocurrió de repente, mientras cenaba.'],['un cáncer','Luchó durante meses contra la enfermedad.'],['alzhéimer avanzado','Llevaba años sin reconocer a casi nadie.'],['una caída en casa','Se rompió la cadera y no se recuperó de la operación.']])}
function relCause(r){
  if(r.age>=60)return pick(['causas naturales','un infarto','una neumonía','un ictus','un cáncer','alzhéimer avanzado','una caída en casa']);
  if(r.age<18)return pick(['una enfermedad grave','un accidente de tráfico','una meningitis']);
  const j=r.job&&RISKY[r.job.t[0]];if(j&&chance(.5))return j[1];
  return pick(['un accidente de tráfico','un cáncer','un infarto fulminante','un accidente laboral','un aneurisma','un atropello'])}

function relAction(r,k,bio){

    case 'baby':{if(bio){if(chance(.5)){const c=addChild();st('hap',12);celebrate();return `👶 ¡Nace tu ${c.sex==='F'?'hija':'hijo'} ${c.first}!`}return 'Este año no hay suerte.'}if(!pay(3000))return 'No tenéis dinero para los trámites de adopción.';const c=addChild(R(0,2));st('hap',12);return `👶 Adoptáis a ${c.first}, ${c.sex==='F'?'una niña':'un niño'} de ${c.age} años.`}

  const verdict=p.karma>5?'😇 Buena persona':p.karma<-5?'😈 Un poco sinvergüenza':'😐 Ni santo ni demonio';
  const rb=p.ribbon||ribbon();
  const map={new:newLifeForm,revive:()=>{p.alive=true;p.s.hea=60;p.sick=null;queue.length=0;L('✨ Resucitas gracias al modo libre. Nadie se lo explica.','good');save();render();closeModal()}};
  kids.forEach(k=>map['k'+k.id]=()=>continueAs(k));
  map.story=()=>copyText(storyText(),'📖 La historia de tu vida','Cópiala y compártela donde quieras.',showDeath);
  openModal(`<div class="avatar big" aria-hidden="true">${avatarSVG(p)}</div><p class="eyebrow">🕊️ Descanse en paz</p><h2>${p.first} ${p.last}</h2><p class="muted">${p.age} años · ${COUNTRIES[p.c].n}</p><p>Murió por ${p.cause}.${p.causeWhy?` ${p.causeWhy}`:''}</p>

    ${timeline()}<div class="choices">${kids.map(k=>`<button class="btn" data-k="k${k.id}">🧬 Seguir como ${k.first} (${k.age} años)</button>`).join('')}

}

const lvl=v=>v<30?'lo':v<60?'mid':'hi';
const barR=(n,v)=>`<div class="stat"><div class="lab">${n}<b>${Math.round(v)}</b></div><div class="track"><div class="fill ${lvl(100-v)}" style="width:${clamp(v,0,100)}%"></div></div></div>`;
const bar=(n,v)=>`<div class="stat"><div class="lab">${n}<b>${Math.round(v)}</b></div><div class="track"><div class="fill ${lvl(v)}" style="width:${clamp(v,0,100)}%"></div></div></div>`;
function status(){
  if(!p.alive)return g('Fallecido','Fallecida');
  if(p.jail)return `⛓️ En ${p.age<18?'el centro de menores':'prisión'} · ${p.jail.left} ${p.jail.left===1?'año':'años'}`;
  const f=(p.fugitive?` · 🏃 ${g('Fugitivo','Fugitiva')}`:'')+(p.undoc?' · 📄 Sin papeles':'')+(p.mob?` · 🕴️ ${rankName(p.mob.rank)}`:'')+(p.vamp?' · 🧛 Vampiro':'')+(p.pol?.o>=0?` · ${OFFICES[p.pol.o].e} ${LV(OFFICES[p.pol.o].n)}`:'');
  if(p.job)return jt(p.job)+f;if(p.uni)return `Estudia ${p.uni.m}`+f;if(p.school)return p.school+f;if(p.retired)return g('Jubilado','Jubilada')+f;
  if(p.age<3)return 'Bebé';return (p.age<6?'Infancia':'Sin trabajo')+f}

function jobReq(j){
  if(p.jail)return 'Estás en prisión';
  if(j.from&&yearNow()<j.from)return `No existe hasta ${j.from}`;
  if(p.age<j.min)return `Desde los ${j.min} años`;
  if(!j.pt&&(p.school||p.uni))return 'Solo a jornada completa';
  if(j.edu&&p.edu<j.edu)return 'Necesitas la secundaria';
  if(j.major&&p.major!==j.major)return `Necesitas la carrera de ${j.major}`;
  if(j.sma&&p.s.sma<j.sma)return `Inteligencia mínima ${j.sma}`;
  if(j.loo&&p.s.loo<j.loo)return `Aspecto mínimo ${j.loo}`;
  if(j.hea&&p.s.hea<j.hea)return `Salud mínima ${j.hea}`;
  if(j.fame&&fame()<j.fame)return `Necesitas fama ${j.fame}`;
  if(j.clean&&p.record)return 'No aceptan antecedentes penales';
  if(p.undoc&&(j.clean||j.major||j.edu||j.fame))return 'Necesitas papeles';
  if((j.major||j.clean)&&!speaks(langOf(p.c)))return `Necesitas hablar ${langOf(p.c).toLowerCase()}`;
  return '';
}

    <div class="btns" style="margin-top:10px">${j.sport?'':`<button class="btn small" data-job="hard" ${full('hard')?'disabled':''}>Trabajar más duro${left('hard')}</button>`}${j.sport||j.mil?'':`<button class="btn small ghost" data-job="raise" ${full('raise')?'disabled':''}>Pedir un aumento</button>`}${p.age>=60&&!j.pt&&!j.sport?'<button class="btn small ghost" data-job="retire">Jubilarme</button>':''}<button class="btn small ghost" data-job="quit">${j.mil?'Pedir la baja':j.sport?'Retirarme':'Dejar el trabajo'}</button></div>`;

  if(p.age>=18)h+=`<h3>📜 Testamento</h3><p class="note">${willText()}</p>${btn('fam','will','Cambiar testamento',0,1)}`;
  h+=`<h3>🏢 Tus negocios</h3>`+(p.biz.length?p.biz.map((b,i)=>{bizInit(b);return `<div class="row"><div><b>${b.e} ${b.n}</b><small>Vale ${fmt(b.v)}${b.yrs?` · último año ${b.last>=0?'+':''}${fmt(b.last)}`:' · recién abierto'} · salud ${b.hp}/100${b.hp<=30?' 🚨':''}${b.last>0?` · 🧾 unos ${fmt(b.last*marginal(p.lastTax?.taxable||0))} de impuestos`:''}</small></div><div class="btns"><button class="btn small" data-bx="manage:${i}" ${p.jail?'disabled':''}>⚙️ Gestionar</button></div></div>`}).join(''):'<p class="note">No tienes negocios. Móntalos desde la tienda, en 🏢 Negocios.</p>');
  h+=`<h3>📈 Inversiones</h3>`+(p.age<18?'<p class="note">Podrás invertir a partir de los 18 años.</p>':INV.filter(x=>x.k!=='crypto'||yearNow()>=2010).map(x=>{const amt=p.inv[x.k]||0,r=p.invLast?.[x.k];return `<div class="row"><div><b>${x.e} ${x.n}</b><small>${amt>=1?`${fmt(amt)} invertido`:'Nada invertido'}${r!=null&&amt>=1?` · último año ${r>=0?'+':''}${Math.round(r*100)} %`:''} · riesgo ${x.r}</small></div><button class="btn small ghost" data-inv="${x.k}" ${p.jail||!p.alive?'disabled':''}>Gestionar</button></div>`}).join(''));
  return h+renderShop();
}
function buy(ref,mort){
  const [ci,ii]=ref.split(':').map(Number),cat=SHOPCATS[ci],it=cat.items[ii];
  if(mort){if(!pay(it.v*.2))return;p.debt+=it.v*.8}else if(!pay(it.v))return result(`No tienes ${fmt(it.v)}.`);
  if(cat.biz){p.biz.push(bizInit({e:it.e,n:it.n,v:it.v,rate:it.rate,risk:it.risk,su:!!it.su,last:0,yrs:0}));st('hap',5);return done(`${it.e} Abres tu negocio: ${it.n.toLowerCase()}. ¡A ver si da dinero!`)}
  if(cat.once){if(it.risk&&chance(it.risk)){st('hea',-R(15,35));st('hap',-5);return done(`${it.e} ${it.fail}`)}
    st('hap',it.h);if(it.loo)st('loo',it.loo);if(it.ach)grant(it.ach);return done(`${it.e} ${it.msg}`)}
  p.assets.push({k:cat.k,e:it.e,n:it.n,v:it.v,m:it.m||0,h:it.h||0,hea:it.hea||0,loo:it.loo||0,sma:it.sma||0,d:it.d});
  st('hap',clamp(it.h||2,2,15));if(it.ach)grant(it.ach);
  done(`${it.e} ${mort?`Compras ${it.n.toLowerCase()} con hipoteca. Debes ${fmt(it.v*.8)} al banco.`:`Compras: ${it.n.toLowerCase()}.`}`);
}
function invest(k){
  const x=INV.find(i=>i.k===k),amt=p.inv[k]||0,map={};
  const opts=[1000,10000,100000].filter(v=>v<=p.money);
  opts.forEach(v=>map['a'+v]=()=>{p.money-=v;p.inv[k]=amt+v;done(`${x.e} Inviertes ${fmt(v)} en ${x.n.toLowerCase()}.`)});
  map.all=()=>{const v=p.money;p.money=0;p.inv[k]=amt+v;done(`${x.e} Inviertes todo tu dinero (${fmt(v)}) en ${x.n.toLowerCase()}.`)};
  map.out=()=>{p.money+=amt;p.inv[k]=0;done(`${x.e} Retiras ${fmt(amt)} de ${x.n.toLowerCase()}.`)};
  openModal(`<p class="eyebrow">${x.e} Inversión · riesgo ${x.r}</p><h2>${x.n}</h2><p class="muted">Tienes ${fmt(amt)} invertido. Rentabilidad media: ${Math.round(x.mu*100)} % al año, pero puede variar mucho de un año a otro.</p><div class="choices">${opts.map(v=>`<button class="btn ghost" data-k="a${v}">Invertir ${fmt(v)}</button>`).join('')}${p.money>=1?`<button class="btn ghost" data-k="all">Invertir todo (${fmt(p.money)})</button>`:''}${amt>=1?`<button class="btn" data-k="out">Retirar todo (${fmt(amt)})</button>`:''}</div>`,map);
}
function renderAch(){
  const n=ACH.filter(a=>S.ach[a.id]).length;
  let h=renderHall()+renderGoals()+`<h3>🏆 Logros · ${n} de ${ACH.length}</h3><p class="note">Se guardan entre vidas.</p><div class="grid">`+ACH.map(a=>{const ok=S.ach[a.id];return `<div class="card ${ok?'':'locked'}"><span class="ico" aria-hidden="true">${ok?a.e:'🔒'}</span><b>${a.n}</b><small>${a.d}</small></div>`}).join('')+'</div>';
  const rib=Object.entries(S.ribbons);
  h+=`<h3>🎀 Cintas</h3>`+(rib.length?`<div class="btns">${rib.map(([k,v])=>`<span class="pill">${k} ×${v}</span>`).join('')}</div>`:'<p class="note">Cada vida que termina gana una cinta según cómo la viviste.</p>');
  h+=`<h3>🪦 Cementerio</h3>`+(S.cemetery.length?S.cemetery.slice(-12).reverse().map(c=>`<div class="row"><div class="lead"><span class="em" aria-hidden="true">${c.rib||'🕊️'}</span><div><b>${c.n}</b><small>${c.age} años · ${c.cause}</small></div></div></div>`).join(''):'<p class="note">Todavía no ha terminado ninguna vida.</p>');
  return h;
}
function render(){
  renderTop();
  const panel=$('#panel');
  panel.innerHTML={vida:renderLog,act:renderActs,car:renderCareer,rel:renderPeople,bie:renderAssets,ach:renderAch}[tab]();
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  if(tab==='vida')panel.scrollTop=panel.scrollHeight;
}
function setTab(t){tab=t;render();if(t!=='vida')$('#panel').scrollTop=0}

/* ---------- clics del panel ---------- */
$('#panel').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
  if(d.act){const [k,i]=d.act.split(':');return doAct(LISTS[k][+i],k)}
  if(d.rel){const r=p.rels.find(x=>x.id===d.rel);return r&&relMenu(r)}
  if(d.emig)return emigrate();
  if(d.papers)return regularize();
  if(d.x){const [m,a,arg]=d.x.split(':');return X[m]&&X[m](a,arg)}
  if(d.mob)return joinMob(+d.mob);
  if(d.mil)return branchPick();
  if(d.sp==='train'){use('train');p.athl=clamp(p.athl+R(3,8)+(p.s.hea>70?2:0),0,100);st('hea',R(1,3));return done(pick(['🏃 Sales a correr al amanecer.','⚽ Entrenas con el equipo hasta tarde.','🏊 Haces largos en la piscina municipal.']))}
  if(d.sp==='try')return tryout();
  if(d.apply){const j=JOBS[+d.apply];use('apply');
    const ok=chance(j.hard?.2+p.s.loo/400+fame()/300:clamp(.55+(p.s.sma-50)/200+(j.major&&j.major===p.major?UT(p.uniType).hire:0),.2,.95));
    if(ok){hire(j);return done(`${j.e} ¡Te contratan de ${j.t[p.sex==='F'?1:0].toLowerCase()}! Cobrarás ${fmt(p.job.sal)} al año.`)}
    return done(`No te cogen para ${j.t[p.sex==='F'?1:0].toLowerCase()}. Prueba otra vez.`)}
  if(d.job){const j=p.job;
    if(d.job==='hard'){use('hard');j.perf=clamp(j.perf+R(6,14)/(has('lazy')?2:1),0,100);addStress(R(3,7));st('hap',-R(1,4));return done('💪 Te dejas la piel en el trabajo. Tus jefes lo notan.')}
    if(d.job==='raise'){use('raise');if(j.sal>=jobCap(j))return done(`📈 Ya cobras el máximo para tu puesto (${fmt(jobCap(j))} al año). Para ganar más, busca un trabajo mejor.`);if(chance(j.perf/140)){j.sal=Math.min(jobCap(j),j.sal*1.08);return done(`📈 Te suben el sueldo a ${fmt(j.sal)} al año.`)}j.perf=clamp(j.perf-5,0,100);return done('Tu jefe se ríe y te dice que vuelvas el año que viene.')}
    if(d.job==='retire')return done(retire());
    if(d.job==='quit'){const t=jt(j).toLowerCase();p.job=null;st('hap',3);return done(`Dejas tu puesto de ${t}.`)}}
  if(d.edu){
    if(d.edu==='study'){use('study');p.study+=has('lazy')?1:2;st('sma',R(1,3)+(has('genius')?1:0)-(has('lazy')?1:0));st('hap',-1);return done('📖 Hincas los codos toda la semana.')}
    if(d.edu==='skip'){use('skip');if(chance(.3)){parents().forEach(r=>r.bond-=8);return done('Te pillan haciendo novillos. Tus padres se enfadan.')}st('hap',5);st('sma',-1);return done('Pasas el día en el parque con tus amigos.')}
    if(d.edu==='drop'){p.uni=null;st('hap',2);return done('Dejas la carrera.')}
    if(d.edu==='adult'){if(!pay(500))return result(`Necesitas ${fmt(500)} para la matrícula.`);use('adult');if(chance(.4+p.s.sma/200)){p.edu=2;return done('🎓 Apruebas y consigues el título de secundaria.')}return done('Suspendes. Puedes intentarlo el año que viene.')}
    if(d.edu==='uni'){const map={};MAJORS.forEach((m,i)=>map['m'+i]=()=>uniTypePick(m.n,m.y,p.s.sma,'🎓 Tu universidad',t=>done(enroll(m,t))));
      return openModal(`<p class="eyebrow">🎓 Universidad</p><h2>¿Qué quieres estudiar?</h2><p class="muted">${fmt(uniCost())} al año. Si no te llega, pides un préstamo.</p><div class="choices">${MAJORS.map((m,i)=>`<button class="btn ghost" data-k="m${i}">${MAJOR_E[m.n]} ${m.n} · ${m.y} años</button>`).join('')}</div>`,map)}}
  if(d.sell){const a=p.assets.splice(+d.sell,1)[0];p.money+=a.v;return done(`💵 Vendes ${a.n.toLowerCase()} por ${fmt(a.v)}.`)}
  if(d.cat){shopCat=+d.cat;const sc=$('#panel').scrollTop;render();$('#panel').scrollTop=sc;return}
  if(d.buy)return buy(d.buy,false);
  if(d.mort)return buy(d.mort,true);
  if(d.rent){const a=p.assets[+d.rent];a.rent=!a.rent;return done(a.rent?`🏘️ Pones en alquiler: ${a.n.toLowerCase()}. Cobrarás ${fmt(a.v*.045)} al año.`:`Dejas de alquilar: ${a.n.toLowerCase()}.`)}
  if(d.pay){const x=Math.min(p.money,p.debt,d.pay==='all'?Infinity:+d.pay);p.money-=x;p.debt-=x;if(p.debt<1)p.debt=0;return done(`💳 Pagas ${fmt(x)} de deuda.${p.debt?` Te quedan ${fmt(p.debt)}.`:' ¡Ya no debes nada!'}`)}
  if(d.bx){const [op,i]=d.bx.split(':');const b=p.biz[+i];
    if(op==='manage')return bizManage(+i);
    if(op==='grow'){if(!pay(b.v*.5))return;b.v*=1.5;b.rate=b.rate*1.02;return done(`${b.e} Amplías tu negocio. Ahora vale ${fmt(b.v)}.`)}
    p.biz.splice(+i,1);p.money+=b.v;return done(`${b.e} Vendes tu negocio (${b.n.toLowerCase()}) por ${fmt(b.v)}.`)}
  if(d.inv)return invest(d.inv);
});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.tab)});
$('#btn-age').addEventListener('click',ageUp);
$('#btn-new').addEventListener('click',newLifeForm);
$('#btn-slots').addEventListener('click',mainMenu);
$('#btn-free').addEventListener('click',()=>{if(p.alive)freeMode();else showDeath()});

/* ---------- guardar ---------- */
function save(){checkMobRank();checkAch();checkGoals();try{localStorage.setItem(skey(),JSON.stringify(S));localStorage.setItem('milvidas-slot',SLOT)}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(skey()));return d&&d.p?d:null}catch(e){return null}}
function migrate(d){
  d.ach=d.ach||{};d.ribbons=d.ribbons||{};d.cemetery=d.cemetery||[];d.gen=d.gen||1;
  const q=d.p,def={traits:[],stress:10,addict:{},hob:{},goals:[],style:'equilibrado',grand:[],mob:null,biz:[],inv:{},undoc:false,fame:0,foll:0,monet:false,jail:null,fugitive:false,record:0,athl:R(10,40),cnt:{},everJob:!!q.job,karma:0,study:0,pension:0,pets:[],assets:[]};
  for(const k in def)if(q[k]===undefined)q[k]=def[k];
  if(!q.av)q.av=makeAv();if(q.ins==null)q.ins=0;if(!q.chronic)q.chronic=[];if(q.cool==null)q.cool=40;
  if(!q.langs)q.langs={[langOf(q.c)]:100};if(q.born==null)q.born=NOW-q.age;if(!q.goals.length)q.goals=pickGoals();d.lineage=d.lineage||[];d.goalsDone=d.goalsDone||0;
  return d;
}
try{window.claude?.hot?.snapshot?.(()=>S)}catch(e){}
function start(data){
  const d=data&&data.p?data:load();
  if(d){S=migrate(d);p=S.p;render();if(!p.alive)showDeath()}else newLife();
  initHall();
  setTimeout(()=>{let seen=null;try{seen=localStorage.getItem('mv-tut')}catch(e){}if(!seen&&$('#overlay').hidden)tutorial()},400);
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
